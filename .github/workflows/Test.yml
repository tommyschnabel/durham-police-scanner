name: Tests

# Runs on every push and PR, including Renovate's, so a dependency bump that
# breaks the app fails here instead of on the stream.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Match the Dockerfile. Also numba's (via librosa) ceiling: on 3.14 it
          # refuses to build with "only versions >=3.10,<3.14 are supported".
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: pytest
        run: pytest -q
