name: Docker Build and Push to GHCR

on:
  push:
    branches:
      - main
      - ci/gate-publish-on-github
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: DEBUG probe runner identity
        run: |
          echo "server_url=[${{ github.server_url }}]"
          echo "GITHUB_SERVER_URL=[$GITHUB_SERVER_URL]"
          echo "GITEA_ACTIONS=[$GITEA_ACTIONS]"
          echo "gate_evaluates_to=[${{ github.server_url == 'https://github.com' }}]"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Self-hosted runners have no GHCR credentials, so they build only.
      - name: Log in to GitHub Container Registry (GHCR)
        if: github.server_url == 'https://github.com'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.server_url == 'https://github.com' }}
          # arm64 needs QEMU binfmt, which only the hosted runners preregister.
          platforms: ${{ github.server_url == 'https://github.com' && 'linux/amd64,linux/arm64/v8' || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # buildx runs in a throwaway container, so without this every run
          # re-pulls base images and rebuilds every layer.
          cache-from: type=gha
          cache-to: type=gha,mode=max
