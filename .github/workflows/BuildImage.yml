name: Docker Build and Push to GHCR

on:
  push:
    branches:
      - main
  # Renovate's branches only get a build check via the PR, and an image that
  # does not build should never reach main.
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # On the self-hosted runner the buildkit container otherwise lands on
          # the default bridge and cannot reach the runner's cache server, so
          # every cache export times out. That network does not exist on
          # GitHub's runners, where buildkit would fail to start.
          # The test is negated because '' is falsy in a GitHub expression, so
          # the empty branch has to be the last one.
          driver-opts: ${{ github.server_url != 'https://github.com' && 'network=tommy_default' || '' }}

      # Self-hosted runners have no GHCR credentials, so they build only.
      - name: Log in to GitHub Container Registry (GHCR)
        if: github.server_url == 'https://github.com' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          # Pull requests are build-validation only: nothing is published
          # until the change is on main.
          push: ${{ github.server_url == 'https://github.com' && github.event_name != 'pull_request' }}
          # arm64 needs QEMU binfmt, which only the hosted runners preregister.
          platforms: ${{ github.server_url == 'https://github.com' && 'linux/amd64,linux/arm64/v8' || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # buildx runs in a throwaway container, so without this every run
          # re-pulls base images and rebuilds every layer.
          cache-from: type=gha
          cache-to: type=gha,mode=max
