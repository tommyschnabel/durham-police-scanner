services:
  transcriber:
    build: .
    container_name: durham-police-transcriber
    ports:
      - "8000:8000"
    volumes:
      # Persist transcripts outside container
      - ./transcripts:/app/transcripts
      # Cache Whisper models
      - whisper-cache:/root/.cache/whisper
    environment:
      # All settings have sensible defaults and can be overridden via env vars
      - STREAM_URL=${STREAM_URL:-https://stream.durhampolicescanner.com/}
      - SAMPLE_RATE=${SAMPLE_RATE:-16000}
      - CHUNK_DURATION_MS=${CHUNK_DURATION_MS:-5000}
      - OVERLAP_MS=${OVERLAP_MS:-1000}
      - WHISPER_MODEL=${WHISPER_MODEL:-medium}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - LANGUAGE=${LANGUAGE:-en}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8000}
      - OUTPUT_FILE=${OUTPUT_FILE:-transcripts/transcript.jsonl}
      - MAX_LOG_SIZE_MB=${MAX_LOG_SIZE_MB:-100}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-7}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    # GPU support - remove if running on CPU-only systems
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/status')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  whisper-cache:
    driver: local
